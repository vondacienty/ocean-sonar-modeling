[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-sonar-modeling"
version = "0.1.0"
description = "Ocean survey and seabed terrain modelling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ocean-sonar-modeling = "ocean_sonar.cli:main"

[tool.setuptools]
packages = ["ocean_sonar"]
